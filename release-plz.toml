# release-plz opens a PR that bumps the workspace version from Conventional
# Commits since the last tag. Merging it pushes a `v{version}` tag, which is
# what .github/workflows/release.yml actually builds and publishes from.
#
# CHANGELOG.md stays hand-written: agentlink's entries carry prose and ADR
# links that a commit-log-derived changelog can't produce, so release-plz is
# not allowed to touch it. Renaming "## [Unreleased]" to the release heading
# is still a manual edit made inside the release PR before merging it.
[workspace]
changelog_update = false
git_tag_enable = true
git_release_enable = false
publish = false
pr_name = "chore: release v{{ version }}"
pr_labels = ["release"]

# All three crates are pinned to [workspace.package] version and always ship
# together, so they must bump in lockstep rather than independently.
[[package]]
name = "agentlink-domain"
version_group = "agentlink"

[[package]]
name = "agentlink-fs"
version_group = "agentlink"

[[package]]
name = "agentlink-cli"
version_group = "agentlink"

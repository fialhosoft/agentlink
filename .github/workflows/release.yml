name: Release

# Merging the release pull request that prepare-release.yml opened is the whole
# release. This workflow builds every target, then tags, publishes the GitHub
# release and pushes to crates.io and npm — in one run, from one merge.
#
# It deliberately does not trigger on a pushed tag. Knope creates the tag as
# part of this run, and a tag pushed by Actions does not start another workflow,
# so a tag trigger would silently never fire.
on:
  pull_request:
    types: [closed]
    branches: [main]
  # Re-running a release that failed partway, without merging anything.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.merged == true && github.head_ref == 'release')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            npm: linux-x64
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            npm: linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            npm: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            npm: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm: win32-x64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            npm: win32-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull_request event checks out a synthetic merge ref by default.
          # Build the commit that actually landed on main, which is also the one
          # the release gets tagged at.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p agentlink-cli
          else
            cargo build --release --target ${{ matrix.target }} -p agentlink-cli
          fi

      # The version comes from the merge commit itself — the release pull
      # request wrote it into Cargo.toml — so nothing has to be passed in or
      # matched against a tag.
      - name: Package
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="agentlink-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/agentlink.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/agentlink" "dist/$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          # Checksums let anyone verify a download independently of GitHub.
          for f in "$name".*; do
            if [ -f "$f" ]; then sha256sum "$f" > "$f.sha256" 2>/dev/null || shasum -a 256 "$f" > "$f.sha256"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.*
          if-no-files-found: error

      # Kept separate from the archive so the npm packaging step gets a bare
      # binary without having to unpack platform-specific archive formats.
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.npm }}
          path: |
            target/${{ matrix.target }}/release/agentlink
            target/${{ matrix.target }}/release/agentlink.exe
          if-no-files-found: error

  # Knope tags the merge commit, creates the GitHub release with the notes it
  # compiled from the change files, and attaches everything in artifacts/.
  github-release:
    name: Tag and publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Tag the commit on main, not the synthetic pull_request merge ref.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: artifacts
      - uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0
      - run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  crates-io:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      # Order matters: dependencies must exist on the registry before dependents.
      - run: cargo publish -p agentlink-domain
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p agentlink-fs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p agentlink-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: Publish to npm
    needs: github-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          pattern: bin-*
          path: binaries
      - name: Read the released version
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Assemble packages
        run: node scripts/build-npm.mjs ${{ steps.version.outputs.version }} binaries
      - name: Publish
        # Provenance ties each published tarball to this workflow run.
        run: |
          for pkg in npm/dist/*/; do
            npm publish "$pkg" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

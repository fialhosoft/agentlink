name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --workspace

  # The decisive Windows case. GitHub's windows runners execute as an
  # administrator, so symlinks succeed there and the junction/import fallback —
  # the path most real users take — would never be exercised. Dropping the
  # privilege forces it.
  windows-unprivileged:
    name: Test Windows without symlink privilege
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Remove SeCreateSymbolicLinkPrivilege from this user
        shell: powershell
        run: |
          $me = "$env:USERDOMAIN\$env:USERNAME"
          secedit /export /cfg current.inf | Out-Null
          (Get-Content current.inf) `
            -replace '^SeCreateSymbolicLinkPrivilege.*$', 'SeCreateSymbolicLinkPrivilege =' |
            Set-Content stripped.inf
          secedit /configure /db secedit.sdb /cfg stripped.inf /areas USER_RIGHTS | Out-Null
          Write-Host "symlink privilege removed for $me"
      - run: cargo test --all-features --workspace

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # Every shipped manifest must parse and satisfy its invariants. This is the
  # guard rail that lets us accept provider contributions confidently.
  manifests:
    name: Validate provider manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p agentlink-domain registry

  # Releases are compiled from the change files in .changeset/, so a pull request
  # that changes behaviour without leaving one ships invisibly — it would reach
  # users with nothing in the changelog to explain it. This is the only thing
  # standing between that and a release, so it is a required check.
  #
  # Work with genuinely nothing to announce (refactors, CI, tests, docs) carries
  # the `no changelog` label instead.
  change-file:
    name: Change documented
    if: >-
      github.event_name == 'pull_request'
      && github.head_ref != 'release'
      && !contains(github.event.pull_request.labels.*.name, 'no changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a change file
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          added=$(git diff --name-only --diff-filter=A \
            "origin/${{ github.base_ref }}...HEAD" -- '.changeset/*.md')
          if [ -z "$added" ]; then
            echo "::error::This pull request adds no change file. Run 'knope document-change', or add the 'no changelog' label if it changes nothing a user would notice. See CONTRIBUTING.md#documenting-a-change."
            exit 1
          fi
          echo "Documented by:"
          echo "$added"
      - uses: knope-dev/action@v2
        with:
          version: 0.23.0
      # Malformed front matter fails the release, long after the pull request
      # that introduced it. Parsing it here reports it to the author instead.
      - name: Check it parses
        run: knope prepare-release --dry-run

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

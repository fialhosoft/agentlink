[workspace]
resolver = "3"
members = ["crates/agentlink-domain", "crates/agentlink-fs", "crates/agentlink-cli"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/fialhosoft/agentlink"
homepage = "https://github.com/fialhosoft/agentlink"
authors = ["The agentlink contributors"]
keywords = ["ai", "agents", "claude", "cursor", "codex"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
agentlink-domain = { path = "crates/agentlink-domain", version = "0.0.2" }
agentlink-fs = { path = "crates/agentlink-fs", version = "0.0.2" }

serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

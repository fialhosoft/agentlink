[package]
name = "agentlink-fs"
description = "Filesystem adapter for agentlink: symlinks, Windows junctions and privilege probing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
agentlink-core.workspace = true

[target.'cfg(windows)'.dependencies]
# Junction points are the reason agentlink works on Windows without elevation,
# and `std` has no API for creating them.
junction = "2"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
junction = "2"

[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
